<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 195" width="300" height="195" role="img" aria-label="gradsnitch mascot: an ugly rat whose tail is a diverging loss curve">
  <!-- tail = the loss curve: decays, plateaus, then blows up -->
  <path d="M 6 26 C 24 76, 38 96, 60 106 C 74 112, 82 113, 90 113
           L 100 44 L 113 134 C 118 150, 124 156, 132 159"
        fill="none" stroke="#8C8580" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="100" cy="44" r="7" fill="#E23D28"/>

  <!-- ears: mismatched, and one has a bite out of it -->
  <g stroke="#3A3430" stroke-width="5" stroke-linejoin="round">
    <circle cx="200" cy="60" r="23" fill="#B9B3AE"/>
    <circle cx="200" cy="60" r="10" fill="#C98B8B" stroke="none"/>
    <path d="M 228 50 A 15 15 0 0 1 237 36 L 244 48 L 251 37
             A 15 15 0 0 1 243 65 A 15 15 0 0 1 228 50 Z" fill="#B9B3AE"/>
    <circle cx="243" cy="55" r="6"  fill="#C98B8B" stroke="none"/>
  </g>

  <!-- body: hunched, lumpy, scraggly fur tufts along the back -->
  <path d="M 128 164 C 104 148, 106 106, 130 90
           L 142 100 L 149 80 L 161 96 L 172 76 L 184 94 L 194 74
           C 214 66, 234 74, 244 90
           L 292 116 L 283 128 L 256 133
           C 246 148, 226 154, 208 150
           C 196 168, 162 176, 142 170 Z"
        fill="#B9B3AE" stroke="#3A3430" stroke-width="5" stroke-linejoin="round"/>

  <!-- snaggleteeth: one long, one stubby, both crooked -->
  <g stroke="#3A3430" stroke-width="4" stroke-linejoin="round">
    <path d="M 262 132 L 275 134 L 269 166 L 258 158 Z" fill="#E8E2D6"/>
    <path d="M 276 134 L 286 135 L 282 150 L 272 147 Z" fill="#E8E2D6"/>
  </g>
  <path d="M 254 136 C 262 142, 268 141, 272 137" fill="none" stroke="#3A3430" stroke-width="4" stroke-linecap="round"/>

  <!-- nose -->
  <circle cx="290" cy="120" r="6" fill="#3A3430"/>

  <!-- two bulging eyes, wrong depths, crossed, one bloodshot -->
  <g stroke="#3A3430" stroke-width="4">
    <circle cx="228" cy="102" r="19" fill="#E8E2D6"/>
    <path d="M 214 94 C 220 99, 219 105, 224 110" fill="none" stroke="#E23D28" stroke-width="2.5"/>
    <circle cx="236" cy="107" r="7" fill="#3A3430" stroke="none"/>
    <circle cx="262" cy="103" r="14" fill="#E8E2D6"/>
    <circle cx="256" cy="109" r="5.5" fill="#3A3430" stroke="none"/>
  </g>

  <!-- crooked whiskers -->
  <g stroke="#3A3430" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 272 140 C 286 146, 294 143, 299 137"/>
    <path d="M 270 148 C 282 160, 290 163, 298 161"/>
    <path d="M 264 154 C 271 168, 278 175, 288 178"/>
  </g>

  <!-- scraggly uneven claws -->
  <g stroke="#3A3430" stroke-width="4" stroke-linecap="round">
    <path d="M 172 172 L 168 186"/><path d="M 183 174 L 183 188"/><path d="M 194 172 L 199 185"/>
  </g>
</svg>
